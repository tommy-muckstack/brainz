name: Brainz CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: brainz-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check source and workflows
        run: |
          go_path=$(go env GOPATH)
          export PATH="$go_path/bin:$PATH"
          script/brainz-ci-test lint

  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: brainz-linux
      - run: script/brainz-ci-test pure

  test-macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: brainz-macos
          cache-on-failure: true
      - name: Check available disk space
        run: df -h
      - name: Native tests and Clippy
        run: script/brainz-ci-test native

  canvas:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          submodules: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: whiteboard/brainz/package-lock.json
      - name: Install browser dependencies
        working-directory: whiteboard/brainz
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Unit tests, production build, and interaction tests
        working-directory: whiteboard/brainz
        run: |
          npm run test:unit
          npm run build
          npm test
      - name: Upload browser failure details
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canvas-test-results
          path: |
            whiteboard/brainz/test-results/
            whiteboard/brainz/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
